[package]
name = "copse-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "m0"
path = "src/bin/m0.rs"

[[bin]]
name = "m1_files"
path = "src/bin/m1_files.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5.17"
rayon = "1.12.0"
reflink-copy = "0.1.33"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
