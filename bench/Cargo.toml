[package]
name = "copse-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "m0"
path = "src/bin/m0.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
