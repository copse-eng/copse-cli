[package]
name = "copse"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "copse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
globset = "0.4.21"
rayon = "1.12.0"
reflink-copy = "0.1.33"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
walkdir = "2.5.0"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
